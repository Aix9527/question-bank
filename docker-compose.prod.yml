services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      QUESTION_BANK_DATABASE_URL: sqlite:////data/question_bank.db
      QUESTION_BANK_AUTH_REQUIRED: "true"
      QUESTION_BANK_AUTH_SESSION_HOURS: ${QUESTION_BANK_AUTH_SESSION_HOURS:-168}
      QUESTION_BANK_BOOTSTRAP_ADMIN_USERNAME: ${QUESTION_BANK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      QUESTION_BANK_BOOTSTRAP_ADMIN_PASSWORD: ${QUESTION_BANK_BOOTSTRAP_ADMIN_PASSWORD:?Set QUESTION_BANK_BOOTSTRAP_ADMIN_PASSWORD}
      QUESTION_BANK_CORS_ORIGINS: https://${QUESTION_BANK_DOMAIN:?Set QUESTION_BANK_DOMAIN}
      QUESTION_BANK_AI_PROVIDER: ${QUESTION_BANK_AI_PROVIDER:-disabled}
      QUESTION_BANK_AI_MODEL: ${QUESTION_BANK_AI_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - question_bank_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: http://api:8000
    environment:
      API_INTERNAL_BASE: http://api:8000
      QUESTION_BANK_AUTH_REQUIRED: "true"
      QUESTION_BANK_COOKIE_SECURE: "true"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      QUESTION_BANK_DOMAIN: ${QUESTION_BANK_DOMAIN:?Set QUESTION_BANK_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  question_bank_data:
  caddy_data:
  caddy_config:
